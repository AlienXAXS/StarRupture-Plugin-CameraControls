name: Build and Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and package only: no GitHub release, no Nexus upload'
        type: boolean
        default: false

jobs:
  release:
    permissions:
      contents: write
    uses: AlienXAXS/StarRupture-Plugin-SDK/.github/workflows/plugin-release.yml@v1.23.2
    with:
      plugin_name: CameraControls
      solution_file: StarRupture-Plugin-CameraControls.sln
      release_title: CameraControls Plugin
      # Global (v3 API) id of the mod page: GET /v3/games/starrupture/mods/145 -> data.id
      nexus_mod_id: '37074157699217'
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
